<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-grad: linear-gradient(rgba(10, 5, 25, 0.92), rgba(5, 2, 15, 0.96));
            --primary: #ff007f;
            --primary-hover: #e60073;
            --box-bg: rgba(18, 10, 35, 0.92);
            --shadow: rgba(255, 0, 127, 0.45);
        }
        body {
            background: var(--bg-grad), 
                        linear-gradient(90deg, rgba(0, 200, 255, 0.15) 0%, rgba(255, 0, 0, 0.15) 100%),
                        url('https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif, cursive;
        }
        .theme-title { color: var(--primary); text-shadow: 0 0 15px var(--shadow); }
        .theme-box { background: var(--box-bg); border: 1.5px solid var(--primary); box-shadow: 0 0 25px var(--shadow); backdrop-filter: blur(8px); }
        .theme-btn { background: var(--primary); color: #fff; font-weight: bold; box-shadow: 0 0 20px var(--shadow); transition: 0.3s; }
        .theme-btn:hover { background: var(--primary-hover); box-shadow: 0 0 30px var(--shadow); }
        
        h1, h2, h3, label, span, button, input, select {
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="min-h-screen font-sans p-4">
    <div class="max-w-4xl mx-auto space-y-6">

                </button>

                <button onclick="switchTab('tracker')" id="btn-tracker" class="px-3 py-2 rounded font-medium theme-btn text-xs">𝓓𝓪𝓲𝓵𝔂 𝓩𝓲𝓴𝓻</button>
                <button onclick="switchTab('extrasawaab')" id="btn-extrasawaab" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300 text-xs">𝓔𝔁𝓽𝓻𝓪 𝓢𝓪𝔀𝓪𝓪𝓫</button>
                <button onclick="switchTab('namaaz')" id="btn-namaaz" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300 text-xs">𝓓𝓪𝓲𝓵𝔂 𝓝𝓪𝓶𝓪𝓪𝓃</button>
                <button onclick="switchTab('analytics')" id="btn-analytics" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300 text-xs">𝓐𝓷𝓪𝓵𝔂𝓽𝓲𝓬𝓼</button>
            </div>
        </header>

        <!-- THEME SELECTION MODAL POPUP (75 Themes) -->
        <div id="themeModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="theme-box p-6 rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col space-y-4 shadow-2xl">

                </div>
                <div id="themeListContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2 overflow-y-auto pr-2 max-h-[60vh]"></div>
            </div>
        </div>

        <!-- TAB 1: DAILY ZIKR -->
        <section id="tab-tracker" class="theme-box p-6 rounded-xl space-y-4">

            </div>

        </section>

            </div>
            <div id="extraList" class="space-y-2"></div>
            <button onclick="save('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra')" class="w-full theme-btn py-2.5 rounded text-sm">𝓢𝓪𝓿𝓮 𝓔𝔁𝓽𝓻𝓪 𝓢𝓪𝔀𝓪𝓪𝓫</button>
        </section>

                        <option value="extra">𝓔𝔁𝓽𝓻𝓪 𝓢𝓪𝔀𝓪𝓪𝓫</option>
                        <option value="namaaz">𝓓𝓪𝓲𝓵𝔂 𝓝𝓪𝓶𝓪𝓪𝓫</option>
                    </select>
                    <select id="timeSelect" onchange="drawChart()" class="bg-slate-900 border rounded p-1.5 text-white text-xs">

                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="cards"></div>
            <div class="relative h-72"><canvas id="myChart"></canvas></div>
        </section>

        function initThemeModal() {
            const container = document.getElementById('themeListContainer');
            container.innerHTML = '';
            Object.keys(themes).forEach(key => {
                const t = themes[key];
                container.innerHTML += `<div onclick="changeTheme('${key}')" class="p-2.5 text-xs rounded-lg cursor-pointer hover:bg-slate-800 transition text-white font-medium border border-slate-700/60 flex items-center justify-between"><span>${t.name}</span><span class="w-3 h-3 rounded-full" style="background:${t.primary}"></span></div>`;
            });
        }

        function toggleThemeModal() {
            const modal = document.getElementById('themeModal');
            modal.classList.toggle('hidden');
        }

        function changeTheme(name) {
            const t = themes[name] || themes.cyberpunkneon;
            const r = document.documentElement;
            r.style.setProperty('--primary', t.primary);
            r.style.setProperty('--primary-hover', t.hover);
            r.style.setProperty('--box-bg', t.box);
            r.style.setProperty('--shadow', t.shadow);
            r.style.setProperty('--bg-grad', t.bg);
            document.getElementById('currentThemeName').innerText = t.name;
            document.getElementById('themeModal').classList.add('hidden');
            localStorage.setItem('selectedTheme', name);
        }

        const savedTheme = localStorage.getItem('selectedTheme') || 'cyberpunkneon';
        initThemeModal();
        changeTheme(savedTheme);

        const persons = ["𝓘𝓶𝓻𝓪𝓷", "𝓢𝓪𝓲𝓶𝓪", "𝓗𝓾𝔃𝓪𝓲𝓯𝓪", "𝓐𝓵𝓲"];
        const zikrs = ["1. 1𝓼𝓽 𝓚𝓪𝓵𝓶𝓪", "2. 4𝓽𝓱 𝓚𝓪𝓵𝓶𝓪", "3. 𝓣𝓪𝓼𝓫𝓮𝓮", "4. 𝓢𝓾𝓫𝓱𝓪𝓷𝓪𝓵𝓵𝓪𝓱𝓲 𝔀𝓪 𝓫𝓲𝓱𝓪𝓶𝓭𝓲𝓱𝓲, 𝓼𝓾𝓫𝓱𝓪𝓷𝓪𝓵𝓵𝓪𝓱𝓲𝓵 𝓪𝔃𝓮𝓮𝓶", "5. 𝓐𝔂𝓽𝓪𝓵 𝓠𝓾𝓻𝓼𝓲", "6. 𝓛𝓪𝓼𝓽 2 𝓐𝓪𝔂𝓪𝓽", "7. 𝓐𝓼𝓽𝓪𝓰𝓯𝓲𝓻𝓾𝓵𝓵𝓪𝓱 (100𝔁)"];
        const extras = ["1. 𝓠𝓾𝓻𝓪𝓷 𝓡𝓮𝓪𝓭𝓲𝓷𝓰", "2. 𝓣𝓪𝓱𝓪𝓳𝓳𝓾𝓭 𝓷𝓪𝓶𝓪𝓪𝔃", "3. 𝓦𝓲𝓽𝓻 𝓷𝓪𝓶𝓪𝓪𝔃", "4. 𝓝𝓪𝓯𝓲𝓵 𝓷𝓪𝓶𝓪𝓪𝔃", "5. 𝓢𝓾𝓷𝓷𝓪𝓽 𝓷𝓪𝓶𝓪𝓪𝔃"];
        const namaazs = ["1. 𝓕𝓪𝓳𝓻", "2. 𝓐𝓼𝓪𝓻", "3. 𝓩𝓸𝓱𝓪𝓻", "4. 𝓜𝓪𝓰𝓱𝓻𝓲𝓫", "5. 𝓘𝓼𝓱𝓪"];

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateSelect').value = today;
        document.getElementById('dateSelectExtra').value = today;
        document.getElementById('dateSelectNamaaz').value = today;

        function renderZikr() {
            const el = document.getElementById('zikrList');
            el.innerHTML = '';
            zikrs.forEach((item, i) => {
                if(i === 3) {
                    el.innerHTML += `
                        <div class="p-2.5 bg-slate-900/80 border border-slate-700 rounded space-y-2">
                            <label class="flex items-center gap-3 cursor-pointer">
                                <input type="checkbox" id="zikr-${i}" class="w-4 h-4 accent-[var(--primary)]">
                                <span class="text-sm font-medium">${item}</span>
                            </label>
                            <div class="flex items-center justify-between pl-7">
                                <span class="text-xs text-slate-400">𝓚𝓲𝓽𝓷𝓲 𝓫𝓪𝓪𝓻 𝓹𝓪𝓭𝓱𝓪 (𝓒𝓸𝓾𝓷𝓽):</span>
                                <input type="number" id="zikr-count-${i}" min="0" placeholder="𝓣𝔂𝓹𝓮 𝓼𝓸𝓶𝓮𝓽𝓱𝓲𝓷𝓰 𝓽𝓸 𝓼𝓽𝓪𝓻𝓽" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs text-white w-44 text-center outline-none focus:border-[var(--primary)]">
                            </div>
                        </div>`;
                } else {
                    el.innerHTML += `<label class="flex items-center gap-3 p-2.5 bg-slate-900/80 border border-slate-700 rounded cursor-pointer"><input type="checkbox" id="zikr-${i}" class="w-4 h-4 accent-[var(--primary)]"><span class="text-sm font-medium">${item}</span></label>`;
                }
            });
        }

        function render(list, id, prefix) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            list.forEach((item, i) => {
                el.innerHTML += `<label class="flex items-center gap-3 p-2.5 bg-slate-900/80 border border-slate-700 rounded cursor-pointer"><input type="checkbox" id="${prefix}-${i}" class="w-4 h-4 accent-[var(--primary)]"><span class="text-sm font-medium">${item}</span></label>`;
            });
        }
        renderZikr();
        render(extras, 'extraList', 'extra');
        render(namaazs, 'namaazList', 'namaaz');

        function switchTab(tab) {
            ['tracker', 'extrasawaab', 'namaaz', 'analytics'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`btn-${t}`).className = `px-3 py-2 rounded font-medium text-xs ${t === tab ? 'theme-btn' : 'bg-slate-800 text-slate-300'}`;
            });
            if(tab === 'analytics') drawChart();
        }

        function getData(key) { return JSON.parse(localStorage.getItem(key) || '{}'); }

        function saveZikr() {
            const p = document.getElementById('personSelect').value;
            const d = document.getElementById('dateSelect').value;
            const data = getData('zikrData');
            if(!data[p]) data[p] = {};
            
            const checks = zikrs.map((_, i) => document.getElementById(`zikr-${i}`).checked);
            const countVal = document.getElementById('zikr-count-3').value || '0';
            
            data[p][d] = { checks: checks, subhanallahCount: countVal };
            localStorage.setItem('zikrData', JSON.stringify(data));
            alert('𝓩𝓲𝓴𝓻 𝓹𝓻𝓸𝓰𝓻𝓮𝓼𝓼 & 𝓬𝓸𝓾𝓷𝓽 𝓼𝓪𝓿𝓮𝓭 𝓼𝓾𝓬𝓬𝓮𝓼𝓼𝓯𝓾𝓵𝓵𝔂!');
        }

        function save(key, list, prefix, pId, dId) {
            const p = document.getElementById(pId).value;
            const d = document.getElementById(dId).value;
            const data = getData(key);
            if(!data[p]) data[p] = {};
            data[p][d] = list.map((_, i) => document.getElementById(`${prefix}-${i}`).checked);
            localStorage.setItem(key, JSON.stringify(data));
            alert('𝓢𝓪𝓿𝓮𝓭 𝓼𝓾𝓬𝓬𝓮𝓼𝓼𝓯𝓾𝓵𝓵𝔂!');
        }

        function loadState() {
            const p = document.getElementById('personSelect').value;
            const d = document.getElementById('dateSelect').value;
            const saved = getData('zikrData')[p]?.[d];
            
            const checks = saved?.checks || new Array(zikrs.length).fill(false);
            zikrs.forEach((_, i) => document.getElementById(`zikr-${i}`).checked = checks[i]);
            document.getElementById('zikr-count-3').value = saved?.subhanallahCount || '';
        }

        function loadStateGeneric(key, list, prefix, pId, dId) {
            const p = document.getElementById(pId).value;
            const d = document.getElementById(dId).value;
            const checks = getData(key)[p]?.[d] || new Array(list.length).fill(false);
            list.forEach((_, i) => document.getElementById(`${prefix}-${i}`).checked = checks[i]);
        }

        document.getElementById('personSelect').onchange = loadState;
        document.getElementById('dateSelect').onchange = loadState;
        document.getElementById('personSelectExtra').onchange = () => loadStateGeneric('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');
        document.getElementById('dateSelectExtra').onchange = () => loadStateGeneric('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');
        document.getElementById('personSelectNamaaz').onchange = () => loadStateGeneric('namaazData', namaazs, 'namaaz', 'personSelectNamaaz', 'dateSelectNamaaz');
        document.getElementById('dateSelectNamaaz').onchange = () => loadStateGeneric('namaazData', namaazs, 'namaaz', 'personSelectNamaaz', 'dateSelectNamaaz');

        loadState();
        loadStateGeneric('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');
        loadStateGeneric('namaazData', namaazs, 'namaaz', 'personSelectNamaaz', 'dateSelectNamaaz');

        let chart = null;
        function drawChart() {
            const cat = document.getElementById('catSelect').value;
            const tf = document.getElementById('timeSelect').value;
            const cards = document.getElementById('cards');
            cards.innerHTML = '';

            if(cat === 'zikr') {
                const data = getData('zikrData');
                const pcts = persons.map(p => {
                    const pData = data[p] || {};
                    let comp = 0, poss = 0, now = new Date();
                    Object.keys(pData).forEach(dStr => {
                        const d = new Date(dStr);
                        let inc = false;
                        if (tf === 'daily' && dStr === today) inc = true;
                        else if (tf === 'weekly' && Math.abs(now - d) / 86400000 <= 7) inc = true;
                        else if (tf === 'monthly' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) inc = true;
                        else if (tf === 'yearly' && d.getFullYear() === now.getFullYear()) inc = true;
                        if (inc && pData[dStr].checks) {
                            pData[dStr].checks.forEach(v => { if(v) comp++; poss++; });
                        }
                    });
                    const pct = poss > 0 ? Math.round((comp / poss) * 100) : 0;
                    cards.innerHTML += `<div class="theme-box p-3 rounded text-center"><p class="text-xs text-slate-300">${p}</p><p class="text-2xl font-bold theme-title">${pct}%</p></div>`;
                    return pct;
                });
                if (chart) chart.destroy();
                chart = new Chart(document.getElementById('myChart').getContext('2d'), {
                    type: 'bar',
                    data: { labels: persons, datasets: [{ label: '𝓩𝓲𝓴𝓻 𝓒𝓸𝓶𝓹𝓵𝓮𝓽𝓲𝓸𝓷 %', data: pcts, backgroundColor: ['#ff007f', '#00c8ff', '#b400ff', '#ff8000'], borderRadius: 6 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
                });
            } else {
                const key = cat === 'extra' ? 'extraData' : 'namaazData';
                const list = cat === 'extra' ? extras : namaazs;
                const data = getData(key);
                const pcts = persons.map(p => {
                    const pData = data[p] || {};
                    let comp = 0, poss = 0, now = new Date();
                    Object.keys(pData).forEach(dStr => {
                        const d = new Date(dStr);
                        let inc = false;
                        if (tf === 'daily' && dStr === today) inc = true;
                        else if (tf === 'weekly' && Math.abs(now - d) / 86400000 <= 7) inc = true;
                        else if (tf === 'monthly' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) inc = true;
                        else if (tf === 'yearly' && d.getFullYear() === now.getFullYear()) inc = true;
                        if (inc && Array.isArray(pData[dStr])) {
                            pData[dStr].forEach(v => { if(v) comp++; poss++; });
                        }
                    });
                    const pct = poss > 0 ? Math.round((comp / poss) * 100) : 0;
                    cards.innerHTML += `<div class="theme-box p-3 rounded text-center"><p class="text-xs text-slate-300">${p}</p><p class="text-2xl font-bold theme-title">${pct}%</p></div>`;
                    return pct;
                });
                if (chart) chart.destroy();
                chart = new Chart(document.getElementById('myChart').getContext('2d'), {
                    type: 'bar',
                    data: { labels: persons, datasets: [{ label: '𝓒𝓸𝓶𝓹𝓵𝓮𝓽𝓲𝓸𝓷 %', data: pcts, backgroundColor: ['#ff007f', '#00c8ff', '#b400ff', '#ff8000'], borderRadius: 6 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
                });
            }
        }
    </script>
