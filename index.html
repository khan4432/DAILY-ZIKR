<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Zikr Portal - Neon Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(rgba(5, 10, 25, 0.90), rgba(5, 10, 25, 0.94)), url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* Neon Glow Effects */
        .neon-title {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6), 0 0 20px rgba(0, 255, 204, 0.4);
        }
        .neon-box {
            background: rgba(13, 20, 38, 0.9);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .neon-btn {
            background: #00ffcc;
            color: #050a19;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            transition: all 0.3s ease;
        }
        .neon-btn:hover {
            background: #00cca3;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-[#00ffcc] shadow-lg py-4 px-6 mb-6">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold neon-title flex items-center gap-2">
                📿 Daily Zikr & Sawaab Portal
            </h1>
            <nav class="flex flex-wrap gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700">
                <button onclick="switchTab('tracker')" id="btn-tracker" class="px-3 py-2 rounded-md font-medium text-sm transition neon-btn">Daily Zikr</button>
                <button onclick="switchTab('extrasawaab')" id="btn-extrasawaab" class="px-3 py-2 rounded-md font-medium text-sm transition text-slate-300 hover:text-white">Extra Sawaab</button>
                <button onclick="switchTab('analytics')" id="btn-analytics" class="px-3 py-2 rounded-md font-medium text-sm transition text-slate-300 hover:text-white">Analytics</button>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pb-12">

        <!-- TAB 1: DAILY TRACKER -->
        <section id="tab-tracker" class="space-y-6">
            <div class="neon-box rounded-xl p-6 shadow-2xl">
                <h2 class="text-xl font-semibold mb-4 text-[#00ffcc]">Mark Daily Zikr Progress</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Select Person:</label>
                        <select id="personSelect" class="w-full bg-slate-900 border border-[#00ffcc] rounded-lg p-2.5 text-white focus:ring-2 focus:ring-[#00ffcc] outline-none">
                            <option value="Imran">Imran</option>
                            <option value="Saima">Saima</option>
                            <option value="Huzaifa">Huzaifa</option>
                            <option value="Ali">Ali</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Select Date:</label>
                        <input type="date" id="dateSelect" class="w-full bg-slate-900 border border-[#00ffcc] rounded-lg p-2.5 text-white focus:ring-2 focus:ring-[#00ffcc] outline-none">
                    </div>
                </div>

                <div class="space-y-3 mb-6" id="zikrList">
                    <!-- Populated via JS -->
                </div>

                <button onclick="saveProgress('zikrData', zikrs, 'zikr')" class="w-full neon-btn py-3 rounded-lg transition shadow-lg">
                    Save Daily Zikr Progress
                </button>
            </div>
        </section>

        <!-- TAB 2: EXTRA SAWAAB -->
        <section id="tab-extrasawaab" class="hidden space-y-6">
            <div class="neon-box rounded-xl p-6 shadow-2xl">
                <h2 class="text-xl font-semibold mb-4 text-[#00ffcc]">Mark Extra Sawaab Progress</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Select Person:</label>
                        <select id="personSelectExtra" class="w-full bg-slate-900 border border-[#00ffcc] rounded-lg p-2.5 text-white focus:ring-2 focus:ring-[#00ffcc] outline-none">
                            <option value="Imran">Imran</option>
                            <option value="Saima">Saima</option>
                            <option value="Huzaifa">Huzaifa</option>
                            <option value="Ali">Ali</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Select Date:</label>
                        <input type="date" id="dateSelectExtra" class="w-full bg-slate-900 border border-[#00ffcc] rounded-lg p-2.5 text-white focus:ring-2 focus:ring-[#00ffcc] outline-none">
                    </div>
                </div>

                <div class="space-y-3 mb-6" id="extraList">
                    <!-- Populated via JS -->
                </div>

                <button onclick="saveProgress('extraData', extras, 'extra')" class="w-full neon-btn py-3 rounded-lg transition shadow-lg">
                    Save Extra Sawaab Progress
                </button>
            </div>
        </section>

        <!-- TAB 3: COMBINED ANALYTICS & CHARTS -->
        <section id="tab-analytics" class="hidden space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-center neon-box p-4 rounded-xl gap-4 shadow-2xl">
                <h2 class="text-xl font-semibold text-[#00ffcc]">Comparison Chart</h2>
                <div class="flex gap-2">
                    <select id="categorySelect" onchange="updateCharts()" class="bg-slate-900 border border-[#00ffcc] rounded-lg p-2 text-white text-sm outline-none">
                        <option value="zikr">Daily Zikr</option>
                        <option value="extra">Extra Sawaab</option>
                    </select>
                    <select id="timeframeSelect" onchange="updateCharts()" class="bg-slate-900 border border-[#00ffcc] rounded-lg p-2 text-white text-sm outline-none">
                        <option value="daily">Daily View</option>
                        <option value="weekly">Weekly View</option>
                        <option value="monthly">Monthly View</option>
                        <option value="yearly">Yearly View</option>
                    </select>
                </div>
            </div>

            <!-- Summary Cards for All 4 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="summaryCards">
                <!-- Populated via JS -->
            </div>

            <!-- Combined Chart Container -->
            <div class="neon-box rounded-xl p-6 shadow-2xl">
                <div class="relative h-96 w-full">
                    <canvas id="zikrChart"></canvas>
                </div>
            </div>
        </section>

    </main>

    <script>
        const persons = ["Imran", "Saima", "Huzaifa", "Ali"];
        
        const zikrs = [
            "1. 1st Kalma",
            "2. 4th Kalma",
            "3. Tasbee",
            "4. Subhanallahi wa bihamdihi, subhanallahil azeem (100x)",
            "5. Aytal Qursi",
            "6. Last 2 Aayat",
            "7. Astagfirullah (100x)"
        ];

        const extras = [
            "1. Quran Reading",
            "2. Tahajjud namaaz",
            "3. Witr namaaz",
            "4. Nafil namaaz",
            "5. Sunnat namaaz"
        ];

        // Initialize Dates
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('dateSelect').value = todayStr;
        document.getElementById('dateSelectExtra').value = todayStr;

        // Render Zikr Checkboxes
        const zikrListEl = document.getElementById('zikrList');
        zikrs.forEach((zikr, index) => {
            zikrListEl.innerHTML += `
                <label class="flex items-center gap-3 p-3 bg-slate-900/80 border border-slate-700 rounded-lg hover:border-[#00ffcc] cursor-pointer transition">
                    <input type="checkbox" id="zikr-${index}" class="w-5 h-5 accent-[#00ffcc] rounded bg-slate-800 border-slate-600">
                    <span class="text-slate-200 font-medium">${zikr}</span>
                </label>
            `;
        });

        // Render Extra Sawaab Checkboxes
        const extraListEl = document.getElementById('extraList');
        extras.forEach((extra, index) => {
            extraListEl.innerHTML += `
                <label class="flex items-center gap-3 p-3 bg-slate-900/80 border border-slate-700 rounded-lg hover:border-[#00ffcc] cursor-pointer transition">
                    <input type="checkbox" id="extra-${index}" class="w-5 h-5 accent-[#00ffcc] rounded bg-slate-800 border-slate-600">
                    <span class="text-slate-200 font-medium">${extra}</span>
                </label>
            `;
        });

        function switchTab(tab) {
            ['tracker', 'extrasawaab', 'analytics'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).className = "px-3 py-2 rounded-md font-medium text-sm transition text-slate-300 hover:text-white";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).className = "px-3 py-2 rounded-md font-medium text-sm transition neon-btn";
            if(tab === 'analytics') updateCharts();
        }

        function getData(storageKey) {
            return JSON.parse(localStorage.getItem(storageKey) || '{}');
        }

        function saveProgress(storageKey, listArr, prefix) {
            const person = document.getElementById(prefix === 'zikr' ? 'personSelect' : 'personSelectExtra').value;
            const date = document.getElementById(prefix === 'zikr' ? 'dateSelect' : 'dateSelectExtra').value;
            const data = getData(storageKey);

            if(!data[person]) data[person] = {};
            
            const checks = [];
            listArr.forEach((_, index) => {
                checks.push(document.getElementById(`${prefix}-${index}`).checked);
            });

            data[person][date] = checks;
            localStorage.setItem(storageKey, JSON.stringify(data));
            alert('Progress saved successfully!');
        }

        function loadFormState(storageKey, listArr, prefix, personId, dateId) {
            const person = document.getElementById(personId).value;
            const date = document.getElementById(dateId).value;
            const data = getData(storageKey);

            const checks = data[person]?.[date] || new Array(listArr.length).fill(false);
            listArr.forEach((_, index) => {
                document.getElementById(`${prefix}-${index}`).checked = checks[index] || false;
            });
        }

        document.getElementById('personSelect').addEventListener('change', () => loadFormState('zikrData', zikrs, 'zikr', 'personSelect', 'dateSelect'));
        document.getElementById('dateSelect').addEventListener('change', () => loadFormState('zikrData', zikrs, 'zikr', 'personSelect', 'dateSelect'));
        
        document.getElementById('personSelectExtra').addEventListener('change', () => loadFormState('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra'));
        document.getElementById('dateSelectExtra').addEventListener('change', () => loadFormState('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra'));

        loadFormState('zikrData', zikrs, 'zikr', 'personSelect', 'dateSelect');
        loadFormState('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');

        let zikrChart = null;

        function updateCharts() {
            const category = document.getElementById('categorySelect').value;
            const timeframe = document.getElementById('timeframeSelect').value;
            const storageKey = category === 'zikr' ? 'zikrData' : 'extraData';
            const data = getData(storageKey);
            const summaryCardsEl = document.getElementById('summaryCards');
            summaryCardsEl.innerHTML = '';

            const percentages = persons.map(person => {
                const pData = data[person] || {};
                let totalCompleted = 0;
                let totalPossible = 0;
                const now = new Date();
                
                Object.keys(pData).forEach(dateStr => {
                    const d = new Date(dateStr);
                    let include = false;

                    if (timeframe === 'daily') {
                        if (dateStr === now.toISOString().split('T')[0]) include = true;
                    } else if (timeframe === 'weekly') {
                        const diffTime = Math.abs(now - d);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        if (diffDays <= 7) include = true;
                    } else if (timeframe === 'monthly') {
                        if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) include = true;
                    } else if (timeframe === 'yearly') {
                        if (d.getFullYear() === now.getFullYear()) include = true;
                    }

                    if (include) {
                        pData[dateStr].forEach(val => {
                            if (val) totalCompleted++;
                            totalPossible++;
                        });
                    }
                });

                const pct = totalPossible > 0 ? Math.round((totalCompleted / totalPossible) * 100) : 0;
                
                summaryCardsEl.innerHTML += `
                    <div class="neon-box p-4 rounded-xl shadow-xl">
                        <h3 class="text-slate-300 text-sm font-medium">${person}</h3>
                        <p class="text-3xl font-bold text-[#00ffcc] mt-2">${pct}%</p>
                        <p class="text-xs text-slate-400 mt-1">${timeframe.toUpperCase()} Completion</p>
                    </div>
                `;

                return pct;
            });

            const ctx = document.getElementById('zikrChart').getContext('2d');
            if (zikrChart) zikrChart.destroy();

            zikrChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: persons,
                    datasets: [{
                        label: `${category.toUpperCase()} - ${timeframe.toUpperCase()} Completion (%)`,
                        data: percentages,
                        backgroundColor: [
                            'rgba(0, 255, 204, 0.85)', 
                            'rgba(0, 150, 255, 0.85)', 
                            'rgba(180, 0, 255, 0.85)', 
                            'rgba(255, 0, 128, 0.85)'  
                        ],
                        borderColor: [
                            '#00ffcc',
                            '#0096ff',
                            '#b400ff',
                            '#ff0080'
                        ],
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: 'rgba(0, 255, 204, 0.1)' },
                            ticks: { color: '#00ffcc', callback: function(value) { return value + '%'; } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#ffffff', font: { weight: 'bold', size: 14 } }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#ffffff' } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` Completion: ${context.raw}%`;
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
