<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Zikr & Sawaab Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #ff007f;
            --box-bg: rgba(18, 10, 35, 0.92);
            --shadow: rgba(255, 0, 127, 0.45);
        }
        body {
            background: linear-gradient(rgba(10, 5, 25, 0.92), rgba(5, 2, 15, 0.96));
            background-size: cover; background-attachment: fixed; color: #ffffff;
        }
        .theme-title { color: var(--primary); text-shadow: 0 0 15px var(--shadow); }
        .theme-box { background: var(--box-bg); border: 1.5px solid var(--primary); box-shadow: 0 0 25px var(--shadow); }
        .theme-btn { background: var(--primary); color: #fff; font-weight: bold; box-shadow: 0 0 20px var(--shadow); transition: 0.3s; }
        .theme-btn:hover { background: #e60073; }
    </style>
</head>
<body class="min-h-screen font-sans p-4">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="theme-box p-4 rounded-xl flex justify-between items-center flex-wrap gap-4">
            <h1 class="text-xl font-bold theme-title">📿 Zikr & Sawaab Portal</h1>
            <div class="flex gap-2">
                <button onclick="switchTab('tracker')" id="btn-tracker" class="px-3 py-2 rounded font-medium theme-btn">Daily Zikr</button>
                <button onclick="switchTab('extrasawaab')" id="btn-extrasawaab" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300">Extra Sawaab</button>
                <button onclick="switchTab('analytics')" id="btn-analytics" class="px-3 py-2 rounded font-medium bg-slate-800 text-slate-300">Analytics</button>
            </div>
        </header>

        <!-- TAB 1 -->
        <section id="tab-tracker" class="theme-box p-6 rounded-xl space-y-4">
            <h2 class="text-lg font-semibold theme-title">Mark Daily Zikr</h2>
            <div class="grid grid-cols-2 gap-4">
                <select id="personSelect" class="bg-slate-900 border border-pink-500 rounded p-2 text-white"><option>Imran</option><option>Saima</option><option>Huzaifa</option><option>Ali</option></select>
                <input type="date" id="dateSelect" class="bg-slate-900 border border-pink-500 rounded p-2 text-white">
            </div>
            <div id="zikrList" class="space-y-2"></div>
            <button onclick="save('zikrData', zikrs, 'zikr', 'personSelect', 'dateSelect')" class="w-full theme-btn py-2.5 rounded">Save Zikr</button>
        </section>

        <!-- TAB 2 -->
        <section id="tab-extrasawaab" class="theme-box p-6 rounded-xl space-y-4 hidden">
            <h2 class="text-lg font-semibold theme-title">Mark Extra Sawaab</h2>
            <div class="grid grid-cols-2 gap-4">
                <select id="personSelectExtra" class="bg-slate-900 border border-pink-500 rounded p-2 text-white"><option>Imran</option><option>Saima</option><option>Huzaifa</option><option>Ali</option></select>
                <input type="date" id="dateSelectExtra" class="bg-slate-900 border border-pink-500 rounded p-2 text-white">
            </div>
            <div id="extraList" class="space-y-2"></div>
            <button onclick="save('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra')" class="w-full theme-btn py-2.5 rounded">Save Extra Sawaab</button>
        </section>

        <!-- TAB 3 -->
        <section id="tab-analytics" class="theme-box p-6 rounded-xl space-y-4 hidden">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h2 class="text-lg font-semibold theme-title">Analytics</h2>
                <div class="flex gap-2">
                    <select id="catSelect" onchange="drawChart()" class="bg-slate-900 border border-pink-500 rounded p-1.5 text-white"><option value="zikr">Zikr</option><option value="extra">Extra Sawaab</option></select>
                    <select id="timeSelect" onchange="drawChart()" class="bg-slate-900 border border-pink-500 rounded p-1.5 text-white"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select>
                </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="cards"></div>
            <div class="relative h-72"><canvas id="myChart"></canvas></div>
        </section>
    </div>

    <script>
        const persons = ["Imran", "Saima", "Huzaifa", "Ali"];
        const zikrs = ["1. 1st Kalma", "2. 4th Kalma", "3. Tasbee", "4. Subhanallahi wa bihamdihi (100x)", "5. Aytal Qursi", "6. Last 2 Aayat", "7. Astagfirullah (100x)"];
        const extras = ["1. Quran Reading", "2. Tahajjud namaaz", "3. Witr namaaz", "4. Nafil namaaz", "5. Sunnat namaaz"];

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateSelect').value = today;
        document.getElementById('dateSelectExtra').value = today;

        function render(list, id, prefix) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            list.forEach((item, i) => {
                el.innerHTML += `<label class="flex items-center gap-3 p-2.5 bg-slate-900/80 border border-slate-700 rounded cursor-pointer"><input type="checkbox" id="${prefix}-${i}" class="w-4 h-4 accent-pink-500"><span class="text-sm">${item}</span></label>`;
            });
        }
        render(zikrs, 'zikrList', 'zikr');
        render(extras, 'extraList', 'extra');

        function switchTab(tab) {
            ['tracker', 'extrasawaab', 'analytics'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`btn-${t}`).className = `px-3 py-2 rounded font-medium ${t === tab ? 'theme-btn' : 'bg-slate-800 text-slate-300'}`;
            });
            if(tab === 'analytics') drawChart();
        }

        function getData(key) { return JSON.parse(localStorage.getItem(key) || '{}'); }

        function save(key, list, prefix, pId, dId) {
            const p = document.getElementById(pId).value;
            const d = document.getElementById(dId).value;
            const data = getData(key);
            if(!data[p]) data[p] = {};
            data[p][d] = list.map((_, i) => document.getElementById(`${prefix}-${i}`).checked);
            localStorage.setItem(key, JSON.stringify(data));
            alert('Saved successfully!');
        }

        function loadState(key, list, prefix, pId, dId) {
            const p = document.getElementById(pId).value;
            const d = document.getElementById(dId).value;
            const checks = getData(key)[p]?.[d] || new Array(list.length).fill(false);
            list.forEach((_, i) => document.getElementById(`${prefix}-${i}`).checked = checks[i]);
        }

        document.getElementById('personSelect').onchange = () => loadState('zikrData', zikrs, 'zikr', 'personSelect', 'dateSelect');
        document.getElementById('dateSelect').onchange = () => loadState('zikrData', zikrs, 'zikr', 'personSelect', 'dateSelect');
        document.getElementById('personSelectExtra').onchange = () => loadState('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');
        document.getElementById('dateSelectExtra').onchange = () => loadState('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');

        loadState('zikrData', zikrs, 'zikr', 'personSelect', 'dateSelect');
        loadState('extraData', extras, 'extra', 'personSelectExtra', 'dateSelectExtra');

        let chart = null;
        function drawChart() {
            const cat = document.getElementById('catSelect').value;
            const tf = document.getElementById('timeSelect').value;
            const data = getData(cat === 'zikr' ? 'zikrData' : 'extraData');
            const cards = document.getElementById('cards');
            cards.innerHTML = '';

            const pcts = persons.map(p => {
                const pData = data[p] || {};
                let comp = 0, poss = 0, now = new Date();
                Object.keys(pData).forEach(dStr => {
                    const d = new Date(dStr);
                    let inc = false;
                    if (tf === 'daily' && dStr === today) inc = true;
                    else if (tf === 'weekly' && Math.abs(now - d) / 86400000 <= 7) inc = true;
                    else if (tf === 'monthly' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) inc = true;
                    else if (tf === 'yearly' && d.getFullYear() === now.getFullYear()) inc = true;
                    if (inc) pData[dStr].forEach(v => { if(v) comp++; poss++; });
                });
                const pct = poss > 0 ? Math.round((comp / poss) * 100) : 0;
                cards.innerHTML += `<div class="theme-box p-3 rounded text-center"><p class="text-xs text-slate-300">${p}</p><p class="text-2xl font-bold theme-title">${pct}%</p></div>`;
                return pct;
            });

            if (chart) chart.destroy();
            chart = new Chart(document.getElementById('myChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: persons,
                    datasets: [{ label: 'Completion %', data: pcts, backgroundColor: ['#ff007f', '#00c8ff', '#b400ff', '#ff8000'], borderRadius: 6 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }
    </script>
</body>
</html>
