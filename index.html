<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Zikr Portal - Rainbow Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.92)), url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA...[embedded_image]...');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* Rainbow Text & Border Accents */
        .rainbow-title {
            background: linear-gradient(90deg, #10b981, #3b82f6, #8b5cf6, #ec4899, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .rainbow-border {
            border-image: linear-gradient(to right, #10b981, #3b82f6, #8b5cf6, #ec4899, #f59e0b) 1;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur border-b-2 rainbow-border shadow-lg py-4 px-6 mb-6">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold rainbow-title flex items-center gap-2">
                📿 Daily Zikr Portal (Imran, Saima, Huzaifa, Ali)
            </h1>
            <nav class="flex gap-2 bg-slate-900/80 p-1 rounded-lg border border-slate-700">
                <button onclick="switchTab('tracker')" id="btn-tracker" class="px-4 py-2 rounded-md font-medium text-sm transition bg-gradient-to-r from-emerald-500 to-blue-500 text-white shadow">Daily Tracker</button>
                <button onclick="switchTab('analytics')" id="btn-analytics" class="px-4 py-2 rounded-md font-medium text-sm transition text-slate-300 hover:text-white">Combined Analytics</button>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pb-12">

        <!-- TAB 1: DAILY TRACKER -->
        <section id="tab-tracker" class="space-y-6">
            <div class="bg-slate-800/85 backdrop-blur border border-slate-700/85 rounded-xl p-6 shadow-2xl">
                <h2 class="text-xl font-semibold mb-4 text-pink-400">Mark Zikr Progress</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Select Person:</label>
                        <select id="personSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-pink-500 outline-none">
                            <option value="Imran">Imran</option>
                            <option value="Saima">Saima</option>
                            <option value="Huzaifa">Huzaifa</option>
                            <option value="Ali">Ali</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1">Select Date:</label>
                        <input type="date" id="dateSelect
