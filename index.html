<!DOCTYPE html>
<html lang="ur-Latn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Zikr & Tasbeeh Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    header h1 {
      color: #38bdf8;
      font-size: 24px;
      margin-bottom: 6px;
    }

    header p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .select-box {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      cursor: pointer;
    }

    .zikr-display {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .arabic-text {
      font-size: 32px;
      color: #38bdf8;
      margin-bottom: 8px;
      direction: rtl;
    }

    .transliteration {
      font-size: 18px;
      font-weight: bold;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .meaning {
      font-size: 13px;
      color: #94a3b8;
    }

    .counter-circle {
      width: 150px;
      height: 150px;
      background: #0284c7;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, background-color 0.2s;
    }

    .counter-circle:active {
      transform: scale(0.95);
      background: #0369a1;
    }

    .count-number {
      font-size: 48px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
    }

    .count-label {
      font-size: 12px;
      color: #bae6fd;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .target-bar {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .action-btns {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset {
      background: #ef4444;
      color: white;
    }

    .btn-reset:hover {
      background: #dc2626;
    }

    .btn-tap {
      background: #38bdf8;
      color: #0f172a;
    }

    .btn-tap:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>

    <header>
      <h1>Daily Zikr & Tasbeeh</h1>
      <p>Apna rozana zikr count karein</p>
    </header>
